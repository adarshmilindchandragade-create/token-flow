# docker-compose.mcp.yml — MCP Gateway Infrastructure Stack for TokenFlow AI
#
# ⚠️  This stack is INFRASTRUCTURE ONLY — not in the v1 extension request path.
#     The VS Code extension calls Anthropic directly (see ADR-002).
#     Activate this for: n8n automation, AI agent tooling, future MCP integration.
#
# Usage:
#   docker compose -f docker-compose.mcp.yml up -d
#   open http://localhost:5678  (n8n UI)
#
# Environment: copy .env.example to .env and fill in values before starting.

name: tokenflow-mcp

services:

  # ─── n8n — First-class MCP server + workflow orchestrator ───────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: tokenflow-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin@tokenflow.dev}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD required}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=tokenflow
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY required}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./.ai/n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mcp-network

  # ─── PostgreSQL — n8n database + future analytics ────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tokenflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=tokenflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenflow -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcp-network
    ports:
      - "5432:5432"  # Expose for local DB tools — remove in production

  # ─── Filesystem MCP Server ────────────────────────────────────────────────
  # Provides safe read/write within the project workspace
  filesystem-mcp:
    image: node:20-alpine
    container_name: tokenflow-filesystem-mcp
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace:ro  # read-only mount of project root
    command: >
      npx -y @modelcontextprotocol/server-filesystem /workspace
    networks:
      - mcp-network

  # ─── Memory MCP Server ───────────────────────────────────────────────────
  # Persistent AI agent memory across sessions
  memory-mcp:
    image: node:20-alpine
    container_name: tokenflow-memory-mcp
    restart: unless-stopped
    volumes:
      - memory-data:/data
    command: >
      npx -y @modelcontextprotocol/server-memory
    environment:
      - MEMORY_FILE_PATH=/data/memory.json
    networks:
      - mcp-network

  # ─── Browser MCP Server ──────────────────────────────────────────────────
  # Marketplace verification, documentation scraping
  browser-mcp:
    image: node:20-alpine
    container_name: tokenflow-browser-mcp
    restart: unless-stopped
    command: >
      npx -y @modelcontextprotocol/server-puppeteer
    networks:
      - mcp-network

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  n8n-data:
    name: tokenflow-n8n-data
  postgres-data:
    name: tokenflow-postgres-data
  memory-data:
    name: tokenflow-memory-data

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  mcp-network:
    name: tokenflow-mcp-network
    driver: bridge
